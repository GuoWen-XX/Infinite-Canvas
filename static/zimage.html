    <style>
        :root {
            --bg-base: var(--bg, #f8f8f8);
            --text-main: var(--text, #1a1a1a);
            --max-w: 1280px;
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
            --accent: var(--strong, #000000);
        }

        /* --- 极简悬浮浅灰滚动条 (无底色/左移) --- */
        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--line-2, #d8d8d8) !important;
            border: 3px solid transparent !important;
            border-right-width: 5px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--ink-secondary, #c0c0c0) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--line-2, #d8d8d8) transparent !important;
        }

        body {
            background-color: var(--bg-base);
            font-family: 'Montserrat', 'Space Grotesk', 'Source Han Sans SC', '思源黑体', -apple-system, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .layout-container {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 40px;
        }

        .console-card {
            background: var(--card, #ffffff);
            border: 1px solid var(--line, rgba(0, 0, 0, 0.08));
            box-shadow: 0 4px 20px var(--shadow, rgba(0, 0, 0, 0.03));
            border-radius: 20px;
            overflow: hidden;
        }

        .mode-switcher {
            position: relative;
            background: var(--card-subtle, #f1f1f1);
            padding: 3px;
            border-radius: 12px;
            display: flex;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--line, transparent);
        }

        .mode-btn {
            position: relative;
            z-index: 10;
            flex: 1;
            padding: 7px 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--ink-tertiary, #999);
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .mode-btn.active {
            color: var(--text, #000);
        }

        .mode-glider {
            position: absolute;
            height: calc(100% - 6px);
            width: calc(50% - 3px);
            background: var(--card, #fff);
            border-radius: 9px;
            box-shadow: 0 1px 4px var(--shadow, rgba(0, 0, 0, 0.08));
            transition: transform 0.3s var(--easing);
            z-index: 1;
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (min-width: 768px) {
            .masonry-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .masonry-item {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card, #eee);
            border: 1px solid var(--line, #f1f5f9);
            transition: all 0.3s var(--easing);
            position: relative;
        }

        .masonry-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px var(--shadow, rgba(0, 0, 0, 0.08));
        }

        .gallery-lightbox {
            background: var(--bg, rgba(255, 255, 255, 0.99));
        }

        .dimension-box {
            background: var(--card-subtle, #fafafa);
            border: 1px solid var(--line, rgba(0,0,0,0.08));
            border-radius: 8px;
            padding: 4px 8px;
        }

        input::-webkit-inner-spin-button {
            display: none;
        }

        /* --- Studio Page Header & Typography --- */
        .studio-page-head {
            display: flex !important;
            align-items: flex-end !important;
            justify-content: space-between !important;
            gap: 20px !important;
            margin-bottom: 32px !important;
            padding-bottom: 22px !important;
            border-bottom: 1px solid var(--line, rgba(0, 0, 0, 0.07)) !important;
        }
        .studio-title-group {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
        }
        .studio-title-row {
            display: flex !important;
            align-items: center !important;
            gap: 14px !important;
            flex-wrap: wrap !important;
        }
        .studio-title {
            margin: 0 !important;
            font-size: 34px !important;
            font-weight: 600 !important;
            line-height: 1.18 !important;
            letter-spacing: -0.01em !important;
            color: var(--text, var(--ink-primary, #0f172a)) !important;
            font-style: normal !important;
            font-feature-settings: "palt" 1, "kern" 1 !important;
        .studio-desc {
            margin: 0 !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            line-height: 1.6 !important;
            letter-spacing: 0.025em !important;
            color: var(--ink-secondary, #64748b) !important;
            font-style: normal !important;
        }
        .studio-head-actions {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            flex-shrink: 0 !important;
        }
        .studio-status-pill {
            height: 34px !important;
            padding: 0 14px !important;
            border-radius: 999px !important;
            border: 1px solid var(--line, rgba(0, 0, 0, 0.08)) !important;
            background: var(--card, #ffffff) !important;
            color: var(--ink-secondary, #64748b) !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            box-shadow: 0 1px 3px var(--shadow, rgba(0,0,0,0.04)) !important;
            font-style: normal !important;
        }
        .studio-status-dot {
            width: 7px !important;
            height: 7px !important;
            border-radius: 50% !important;
            background: #10b981 !important;
            display: inline-block !important;
        }
        .studio-status-dot.busy {
            background: #d97706 !important;
            animation: studioPulse 1.5s infinite ease-in-out !important;
        }
    </style>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('nav.textToImage');
            const trigger = document.getElementById('loadMoreTrigger');
            if(trigger && !isLoading) trigger.innerText = tr('studio.loadMore');
            switchEngine(currentEngine || localStorage.getItem(ENGINE_MODE_KEY) || 'local');
        }
        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => { document.title = tr('nav.textToImage'); });

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        let allHistory = [];
        let currentIndex = 0;
        const PAGE_SIZE = 15;
        let isLoading = false;

        // WebSocket 
        const socket = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/stats?client_id=${encodeURIComponent(CLIENT_ID)}`);
        socket.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'new_image' && msg.data?.type === 'zimage') {
                    if (!document.getElementById(`history-${msg.data.timestamp}`)) {
                        allHistory.unshift(msg.data);
                        renderImageCard(msg.data, true);
                        currentIndex++;
                    }
                }
            } catch (err) { }
        };

        let currentEngine = 'local';
        const MS_TOKEN_KEY = 'modelscope_api_token';
        const ENGINE_MODE_KEY = 'zimage_engine_mode';

        // 1. Token handled via index.html sidebar

        // 2. 切换引擎逻辑
        function switchEngine(mode) {
            currentEngine = mode;
            localStorage.setItem(ENGINE_MODE_KEY, mode); // Save state

            const glider = document.getElementById('glider');
            const localBtn = document.getElementById('modeLocal');
            const cloudBtn = document.getElementById('modeCloud');
            const btnText = document.getElementById('btnText');

            if (mode === 'local') {
                glider.style.transform = 'translateX(0)';
                localBtn.classList.add('active');
                cloudBtn.classList.remove('active');
                btnText.innerText = tr('studio.renderLocal');
            } else {
                glider.style.transform = 'translateX(100%)';
                cloudBtn.classList.add('active');
                localBtn.classList.remove('active');
                btnText.innerText = tr('studio.renderCloud');
            }
        }

        // Initialize Engine Mode
        const savedEngine = localStorage.getItem(ENGINE_MODE_KEY);
        if (savedEngine && savedEngine !== 'local') {
            switchEngine(savedEngine);
        }

        // 3. 统一渲染入口
        async function handleRender() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return alert("Please enter a prompt");

            if (currentEngine === 'local') {
                runLocalTask(prompt);
            } else {
                runCloudTask(prompt);
            }
        }

        // 4. ModelScope 云端逻辑
        async function runCloudTask(prompt) {
            // 优先用 API 设置里集中管理的 Token（服务端）；localStorage 仅作旧版兜底
            let apiKey = '';
            try {
                const res = await fetch('/api/config/token');
                const data = await res.json();
                if (data.token) apiKey = data.token;
            } catch (e) { }
            if (apiKey) {
                // 自愈：清掉可能过期的旧版本地 Token，避免覆盖服务端有效 Token
                try { localStorage.removeItem(MS_TOKEN_KEY); } catch (e) { }
            } else {
                apiKey = localStorage.getItem(MS_TOKEN_KEY) || '';
            }
            if (!apiKey) return alert(tr('studio.modelscopeTokenRequired'));

            const btn = document.getElementById('mainGenBtn');
            setLoading(true);

            const placeholder = createPlaceholder("ModelScope Rendering");
            document.getElementById('masonry').prepend(placeholder);

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        api_key: apiKey,
                        resolution: `${document.getElementById('width').value}x${document.getElementById('height').value}`
                    })
                });
                const data = await res.json();
                placeholder.remove();
                if (res.ok && data.url) {
                    renderImageCard({ timestamp: Date.now(), prompt, images: [data.url], type: 'cloud' }, true);
                } else {
                    throw new Error(data.detail?.errors?.message || data.detail || "Cloud Error");
                }
            } catch (e) {
                placeholder.remove();
                alert(e.message);
            } finally {
                setLoading(false);
            }
        }

        // 5. 本地任务逻辑
        async function runLocalTask(prompt) {
            setLoading(true);
            const placeholder = createPlaceholder("Local Rendering");
            document.getElementById('masonry').prepend(placeholder);

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        width: parseInt(document.getElementById('width').value),
                        height: parseInt(document.getElementById('height').value),
                        type: "zimage",
                        client_id: CLIENT_ID
                    })
                });
                const data = await res.json();
                placeholder.remove();
                if (data.images?.length > 0) renderImageCard(data, true);
            } catch (e) {
                placeholder.remove();
                alert("Local render failed");
            } finally {
                setLoading(false);
            }
        }

        // 工具函数
        function setDimensions(w, h) {
            document.getElementById('width').value = w;
            document.getElementById('height').value = h;
        }

        let latestStageData = null;
        function zoomLatestStage() {
            if (latestStageData) openLightbox(latestStageData);
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('mainGenBtn');
            btn.disabled = isLoading;

            const stageLoading = document.getElementById('stageLoading');
            const stageEmpty = document.getElementById('stageEmpty');
            const stageImg = document.getElementById('stageImg');
            if (stageLoading) {
                if (isLoading) {
                    stageLoading.classList.remove('hidden');
                    if (stageEmpty) stageEmpty.classList.add('hidden');
                    if (stageImg) stageImg.classList.add('hidden');
                } else {
                    stageLoading.classList.add('hidden');
                }
            }

            if (isLoading) {
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>${tr('studio.processing')}</span>`;
            } else {
                btn.style.backgroundColor = '';
                btn.innerHTML = `<i data-lucide="sparkles" id="btnIcon" class="w-4 h-4"></i><span id="btnText">${currentEngine === 'cloud' ? tr('studio.renderCloud') : tr('studio.renderLocal')}</span>`;
            }
            lucide.createIcons();
        }

        function createPlaceholder(text) {
            const div = document.createElement('div');
            div.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            div.innerHTML = `<div class="w-6 h-6 border-2 border-gray-100 border-t-black rounded-full animate-spin mb-3"></div><span class="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">${text}</span>`;
            return div;
        }

        function renderImageCard(data, isNew = false) {
            if (document.getElementById(`history-${data.timestamp}`)) return;
            if (isNew && !allHistory.some(it => (it.timestamp && it.timestamp === data.timestamp) || it === data)) {
                allHistory.unshift(data);
            }
            const imgSrc = (typeof safeMediaUrl === 'function') ? safeMediaUrl(data.images?.[0]) : (data.images?.[0] || '');
            if (!imgSrc) return;

            // Update live stage
            const stageEmpty = document.getElementById('stageEmpty');
            const stageImg = document.getElementById('stageImg');
            const stageZoomBtn = document.getElementById('stageZoomBtn');
            const stageDownloadBtn = document.getElementById('stageDownloadBtn');
            if (stageImg && (isNew || !latestStageData)) {
                if (stageEmpty) stageEmpty.classList.add('hidden');
                stageImg.src = imgSrc;
                stageImg.classList.remove('hidden');
                if (stageZoomBtn) stageZoomBtn.classList.remove('hidden');
                if (stageDownloadBtn) {
                    stageDownloadBtn.href = imgSrc;
                    stageDownloadBtn.classList.remove('hidden');
                }
                latestStageData = data;
            }

            const masonry = document.getElementById('masonry');
            const card = document.createElement('div');
            card.id = `history-${data.timestamp}`;
            card.dataset.historyTs = data.timestamp;
            card.className = 'masonry-item group cursor-zoom-in animate-in fade-in duration-700';
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(data); };
            card.innerHTML = `
            <img src="${imgSrc}" class="w-full h-full object-cover" loading="lazy">
            ${data.type === 'cloud' ? '<div class="absolute top-3 left-3 z-10"><img src="/static/images/modelscope.gif" class="h-4 w-auto object-contain bg-white/90 rounded-full p-0.5 shadow-sm"></div>' : ''}
        `;
            isNew ? masonry.prepend(card) : masonry.appendChild(card);
            lucide.createIcons();
        }

        async function loadHistory(page = 0) {
            if (isLoading) return;
            const trigger = document.getElementById('loadMoreTrigger');

            try {
                isLoading = true;
                if (page === 0) {
                    allHistory = [];
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;

                    trigger.classList.remove('hidden');
                    trigger.innerText = tr('studio.loadingArchives');

                    const res = await fetch('/api/history?type=zimage');
                    allHistory = await res.json();
                } else {
                    trigger.innerText = "Loading...";
                    await new Promise(r => setTimeout(r, 400));
                }

                const nextData = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
                nextData.forEach(item => renderImageCard(item));
                currentIndex += nextData.length;

                if (currentIndex >= allHistory.length) {
                    trigger.classList.add('hidden');
                } else {
                    trigger.classList.remove('hidden');
                    trigger.innerText = "Load More Archive";
                }

            } catch (e) {
                console.error(e);
                trigger.innerText = tr('studio.errorHistory');
            } finally {
                isLoading = false;
            }
        }

        async function deleteHistoryItem(timestamp, event) {
            event.stopPropagation();
            const res = await fetch('/api/history/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ timestamp })
            });
            if ((await res.json()).success) document.getElementById(`history-${timestamp}`).remove();
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && currentIndex < allHistory.length) {
                loadHistory(1);
            }
        }, { threshold: 0.1 });

        window.onload = () => {
            loadHistory(0).then(() => {
                window.HistoryBulkManager?.attach({masonry:'#masonry'});
                const trigger = document.getElementById('loadMoreTrigger');
                if (trigger) {
                    observer.observe(trigger);
                    trigger.onclick = () => loadHistory(1);
                }
            });

            setInterval(async () => {
                try {
                    const res = await fetch("/api/queue_status?client_id=" + encodeURIComponent(CLIENT_ID));
                    const data = await res.json();
                    const statusText = document.getElementById("statusText");
                    const dotColor = document.getElementById("dotColor");
                    if (statusText && dotColor) {
                        if (data.total > 0) {
                            statusText.innerText = `Queueing ${data.position}/${data.total}`;
                            dotColor.className = "studio-status-dot busy";
                        } else {
                            statusText.innerText = tr('studio.ready');
                            dotColor.className = "studio-status-dot";
                        }
                    }
                } catch (e) { }
            }, 3000);
        };

        // 基础功能
        let lightboxPreview = null;
        let currentGalleryIndex = -1;
        let galleryEntries = [];

        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }

        function getGalleryEntries(){
            const entries = [];
            const source = [...(allHistory || [])];
            for(const item of source){
                const imgs = Array.isArray(item?.images) ? item.images : (item?.images ? [item.images] : []);
                imgs.forEach((url, idx) => {
                    if(url){
                        entries.push({
                            record: item,
                            url: url,
                            imageIndex: idx,
                            totalImages: imgs.length,
                            prompt: item.prompt || ''
                        });
                    }
                });
            }
            return entries;
        }

        function updateLightboxNav(){
            const prevBtn = document.getElementById('lightboxPrev');
            const nextBtn = document.getElementById('lightboxNext');
            if(!prevBtn || !nextBtn) return;

            if(!galleryEntries || galleryEntries.length <= 1){
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                return;
            }
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';

            const hasPrev = currentGalleryIndex > 0;
            const hasNext = currentGalleryIndex < galleryEntries.length - 1;

            prevBtn.disabled = !hasPrev;
            nextBtn.disabled = !hasNext;
            prevBtn.classList.toggle('disabled', !hasPrev);
            nextBtn.classList.toggle('disabled', !hasNext);
        }

        function showLightboxItem(index){
            if(!galleryEntries || !galleryEntries.length) return;
            if(index < 0) index = 0;
            if(index >= galleryEntries.length) index = galleryEntries.length - 1;
            currentGalleryIndex = index;
            const entry = galleryEntries[index];

            const img = document.getElementById('lightboxImg');
            const resDisplay = document.getElementById('lightboxRes');
            resDisplay.innerText = "...";
            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.src = entry.url;
            img.onload = () => {
                const dim = `${img.naturalWidth} x ${img.naturalHeight}`;
                resDisplay.innerText = entry.totalImages > 1 ? `(${entry.imageIndex + 1}/${entry.totalImages}) ${dim}` : dim;
            };
            document.getElementById('lightboxPrompt').innerText = entry.prompt || entry.record?.prompt || '';
            updateLightboxNav();
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function openLightbox(urlOrData, prompt) {
            galleryEntries = getGalleryEntries();
            let targetUrl = '';
            let targetRecord = null;
            if (typeof urlOrData === 'object' && urlOrData !== null) {
                targetRecord = urlOrData;
                targetUrl = urlOrData.images?.[0] || '';
            } else if (typeof urlOrData === 'string') {
                targetUrl = urlOrData;
            }

            let idx = -1;
            if (targetRecord) {
                idx = galleryEntries.findIndex(e => e.record === targetRecord || (targetRecord.timestamp && e.record?.timestamp === targetRecord.timestamp));
            }
            if (idx === -1 && targetUrl) {
                idx = galleryEntries.findIndex(e => e.url === targetUrl);
            }
            if (idx === -1) {
                galleryEntries = [{
                    record: targetRecord || { images: [targetUrl], prompt: prompt || '' },
                    url: targetUrl,
                    imageIndex: 0,
                    totalImages: 1,
                    prompt: prompt || targetRecord?.prompt || ''
                }];
                idx = 0;
            }
            showLightboxItem(idx);
        }

        function prevLightboxImage(e){
            if(e){ e.stopPropagation(); e.preventDefault(); }
            if(currentGalleryIndex > 0){
                showLightboxItem(currentGalleryIndex - 1);
            }
        }

        function nextLightboxImage(e){
            if(e){ e.stopPropagation(); e.preventDefault(); }
            if(galleryEntries && currentGalleryIndex < galleryEntries.length - 1){
                showLightboxItem(currentGalleryIndex + 1);
            }
        }

        function closeLightbox() {
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto';
            currentGalleryIndex = -1;
        }

        function handleOutsideClick(e) { if (e.target.id === 'lightbox') closeLightbox(); }

        function downloadImage() {
            const currentEntry = galleryEntries?.[currentGalleryIndex];
            const src = currentEntry?.url || document.getElementById('lightboxImg').src;
            if(!src) return;
            const a = document.createElement('a');
            a.href = src;
            a.download = `Art-${Date.now()}.png`;
            a.click();
        }

        function applySameStyle() {
            document.getElementById('prompt').value = document.getElementById('lightboxPrompt').innerText;
            closeLightbox();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if(!lb || lb.classList.contains('hidden')) return;
            if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
            if(e.key === 'ArrowLeft'){
                prevLightboxImage(e);
            } else if(e.key === 'ArrowRight'){
                nextLightboxImage(e);
            } else if(e.key === 'Escape'){
                closeLightbox();
            }
        });
    </script>
</body>

</html>
