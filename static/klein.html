<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/static/images/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <title>Flux Klein | 极简一体化终端</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/vendor/css/tailwind.css?v=2026.10.04.1789919950">
    <script src="/static/vendor/js/lucide.js?v=2026.10.04.1787932386"></script>
    <script src="/static/js/utils/escape.js?v=2026.10.04.1789929488"></script>
    <script src="/static/js/theme.js?v=2026.10.04.1788673394"></script>
    <script src="/static/js/i18n.js?v=2026.10.04.1790129704"></script>
    <script src="/static/js/image-preview.js?v=2026.10.04.1787932356"></script>
    <script src="/static/js/history-bulk-manager.js?v=2026.10.04.1790800008"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.10.04.1790813007');

        :root {
            --accent: #111827;
            --bg: #f8fafc;
            --card: #ffffff;
            --line: rgba(10, 10, 10, 0.08);
            --line-2: rgba(10, 10, 10, 0.16);
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        *::-webkit-scrollbar { width:8px!important; height:8px!important; background:transparent!important; }
        *::-webkit-scrollbar-track { background:transparent!important; border:none!important; }
        *::-webkit-scrollbar-thumb { background-color:rgba(148,163,184,0.4)!important; border:2px solid transparent!important; background-clip:padding-box!important; border-radius:10px!important; }
        *::-webkit-scrollbar-thumb:hover { background-color:rgba(148,163,184,0.6)!important; }
        *::-webkit-scrollbar-corner { background:transparent!important; }
        * { scrollbar-width:thin!important; scrollbar-color:rgba(148,163,184,0.4) transparent!important; }

        body {
            background-color: var(--bg);
            font-family: var(--font-mixed);
            color: var(--accent);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "palt" 1, "kern" 1;
            letter-spacing: 0.01em;
        }

        .container-box {
            max-width: 1360px;
            margin: 0 auto;
            padding: 24px 32px;
            min-height: 100vh;
        }

        .nano-input {
            background: var(--card);
            border: 1px solid var(--line);
            color: inherit;
            border-radius: 14px;
            transition: all 0.25s var(--easing);
        }
        .nano-input:focus {
            border-color: var(--strong, #000);
            box-shadow: 0 0 0 1px var(--strong, #000);
        }

        .upload-item {
            background: var(--card);
            border: 1px dashed var(--line);
            border-radius: 14px;
            transition: all 0.3s var(--easing);
            position: relative;
            overflow: hidden;
        }
        .upload-item:hover {
            border-color: var(--strong, #000);
            transform: translateY(-1px);
        }
        .upload-item.drag-over {
            border-style: solid;
            border-color: var(--strong, #000);
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
        }

        .preview-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 0.4s var(--easing);
        }

        /* Engine panel */
        .engine-panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .engine-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink-caption);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .02em;
        }
        .engine-switch {
            background: var(--soft, #f1f5f9);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 3px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .engine-btn {
            border-radius: 8px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--ink-tertiary);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .01em;
            transition: all .2s var(--easing);
            cursor: pointer;
            background: transparent;
        }
        .engine-btn.active {
            background: var(--card);
            color: var(--ink-primary);
            box-shadow: 0 1px 3px var(--shadow, rgba(0,0,0,0.06));
        }
        .engine-btn:not(.active):hover {
            color: var(--ink-primary);
            background: rgba(0,0,0,.03);
        }

        .cloud-status {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #64748b;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .cloud-status.visible { display: flex; }
        .cloud-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }

        .result-frame {
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: 0 2px 14px var(--shadow, rgba(0,0,0,0.03));
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (min-width: 768px) { .masonry-grid { grid-template-columns: repeat(4, 1fr); } }

        .masonry-item {
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            transition: all 0.3s var(--easing);
        }
        .masonry-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px var(--shadow, rgba(0,0,0,0.06));
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .lora-track { background: var(--line-2, #d1d5db); }
        .lora-track.on { background: var(--strong, #111827); }
        html.studio-theme-dark .lora-track { background: #3a465a; }
        html.studio-theme-dark .lora-track.on { background: #3b82f6; }

        /* --- Studio Page Header & Typography --- */
        .studio-page-head {
            display: flex !important;
            align-items: flex-end !important;
            justify-content: space-between !important;
            gap: 20px !important;
            margin-bottom: 32px !important;
            padding-bottom: 22px !important;
            border-bottom: 1px solid var(--line, rgba(0, 0, 0, 0.07)) !important;
        }
        .studio-title-group {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
        }
        .studio-title-row {
            display: flex !important;
            align-items: center !important;
            gap: 14px !important;
            flex-wrap: wrap !important;
        }
        .studio-title {
            margin: 0 !important;
            font-size: 34px !important;
            font-weight: 600 !important;
            line-height: 1.18 !important;
            letter-spacing: -0.01em !important;
            color: var(--text, var(--ink-primary, #0f172a)) !important;
            font-style: normal !important;
            font-feature-settings: "palt" 1, "kern" 1 !important;
        .studio-desc {
            margin: 0 !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            line-height: 1.6 !important;
            letter-spacing: 0.025em !important;
            color: var(--ink-secondary, #64748b) !important;
            font-style: normal !important;
        }
        .studio-head-actions {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            flex-shrink: 0 !important;
        }
        .studio-status-pill {
            height: 34px !important;
            padding: 0 14px !important;
            border-radius: 999px !important;
            border: 1px solid var(--line, rgba(0, 0, 0, 0.08)) !important;
            background: var(--card, #ffffff) !important;
            color: var(--ink-secondary, #64748b) !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            box-shadow: 0 1px 3px var(--shadow, rgba(0,0,0,0.04)) !important;
            font-style: normal !important;
        }
        .studio-status-dot {
            width: 7px !important;
            height: 7px !important;
            border-radius: 50% !important;
            background: #10b981 !important;
            display: inline-block !important;
        }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.10.04.1790863528">
</head>

<body class="antialiased transition-colors duration-300">
    <div class="container-box max-w-7xl mx-auto px-6 lg:px-8 py-8 min-h-screen flex flex-col">
        <header class="studio-page-head flex items-end justify-between gap-5 mb-8 pb-6 border-b border-[var(--line,rgba(0,0,0,0.07))]">
            <div class="studio-title-group flex flex-col gap-2">
                <div class="studio-title-row flex items-center gap-3.5 flex-wrap">
                    <h1 class="studio-title text-3xl lg:text-4xl font-semibold tracking-normal text-[var(--text,#0f172a)]" data-i18n="studio.kleinTitle">图片编辑</h1>
                </div>
                <p class="studio-desc text-xs md:text-sm text-[var(--ink-secondary,#64748b)]" data-i18n="studio.kleinDesc">基于多图层参考与引导控制的高精度局部图像重绘终端。</p>
            </div>
            <div class="studio-head-actions flex items-center gap-2.5 flex-shrink-0">
                <div id="studioStatus" class="studio-status-pill inline-flex items-center gap-2 h-8 px-3.5 rounded-full border border-[var(--line,rgba(0,0,0,0.08))] bg-[var(--card,#ffffff)] text-[11px] font-semibold text-[var(--ink-secondary,#64748b)] shadow-sm">
                    <span class="studio-status-dot"></span>
                    <span id="statusText" data-i18n="studio.systemReady">系统就绪</span>
                </div>
            </div>
        </header>

        <main class="studio-workbench items-start">
            <div class="studio-workbench-left">
                <!-- Prompt Section -->
                <section class="studio-card-panel">
                    <div class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-[var(--ink-secondary)]">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="studio.inputPrompt">输入提示词</span>
                    </div>
                    <textarea id="promptInput" rows="3"
                        class="nano-input w-full p-4 rounded-xl text-sm outline-none resize-none placeholder-[var(--ink-tertiary)] bg-[var(--card-subtle)] border border-[var(--line)] text-[var(--text)] transition-colors leading-relaxed"
                        placeholder="描述想要生成或局部重绘的画面..." data-i18n-placeholder="studio.describeVision"></textarea>
                </section>

                <!-- Reference Layers -->
                <section class="studio-card-panel">
                    <div class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-[var(--ink-secondary)]">
                        <i data-lucide="image" class="w-3.5 h-3.5"></i>
                        <span data-i18n="studio.referenceLayers">参考图层</span>
                        <span id="cloudImgNote" class="hidden ml-auto text-[9px] font-bold text-[var(--accent)] bg-[var(--rule-soft)] px-2 py-0.5 rounded-full" data-i18n="studio.cloudUsesMain">云端仅使用主图</span>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div id="drop-zone-1" onclick="document.getElementById('file1').click()"
                            class="upload-item group aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer border border-dashed border-[var(--line-2,#cbd5e1)] hover:border-[var(--strong)] transition-all bg-[var(--card-subtle)]">
                            <input type="file" id="file1" class="hidden" onchange="handleFile(this.files[0], 1)">
                            <i data-lucide="plus" class="w-4 h-4 text-[var(--ink-tertiary)] group-hover:text-[var(--text)] transition-colors"></i>
                            <span class="text-[9px] mt-1.5 font-bold text-[var(--ink-secondary)] uppercase">Main</span>
                            <img id="prev1" class="preview-img hidden">
                            <button id="del1" onclick="clearSlot(1, event)"
                                class="hidden absolute top-2 right-2 w-6 h-6 bg-[var(--card)] rounded-full shadow-sm z-10 flex items-center justify-center text-xs border border-[var(--line)]">×</button>
                        </div>
                        <div id="drop-zone-2" onclick="document.getElementById('file2').click()"
                            class="upload-item group aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer border border-dashed border-[var(--line-2,#cbd5e1)] hover:border-[var(--strong)] transition-all bg-[var(--card-subtle)]">
                            <input type="file" id="file2" class="hidden" onchange="handleFile(this.files[0], 2)">
                            <i data-lucide="plus" class="w-4 h-4 text-[var(--ink-tertiary)] group-hover:text-[var(--text)] transition-colors"></i>
                            <span class="text-[9px] mt-1.5 font-bold text-[var(--ink-secondary)] uppercase">Aux A</span>
                            <img id="prev2" class="preview-img hidden">
                            <button id="del2" onclick="clearSlot(2, event)"
                                class="hidden absolute top-2 right-2 w-6 h-6 bg-[var(--card)] rounded-full shadow-sm z-10 flex items-center justify-center text-xs border border-[var(--line)]">×</button>
                        </div>
                        <div id="drop-zone-3" onclick="document.getElementById('file3').click()"
                            class="upload-item group aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer border border-dashed border-[var(--line-2,#cbd5e1)] hover:border-[var(--strong)] transition-all bg-[var(--card-subtle)]">
                            <input type="file" id="file3" class="hidden" onchange="handleFile(this.files[0], 3)">
                            <i data-lucide="plus" class="w-4 h-4 text-[var(--ink-tertiary)] group-hover:text-[var(--text)] transition-colors"></i>
                            <span class="text-[9px] mt-1.5 font-bold text-[var(--ink-secondary)] uppercase">Aux B</span>
                            <img id="prev3" class="preview-img hidden">
                            <button id="del3" onclick="clearSlot(3, event)"
                                class="hidden absolute top-2 right-2 w-6 h-6 bg-[var(--card)] rounded-full shadow-sm z-10 flex items-center justify-center text-xs border border-[var(--line)]">×</button>
                        </div>
                    </div>
                </section>

                <!-- Engine & LoRA Section -->
                <section class="studio-card-panel">
                    <div class="engine-panel border-none p-0 bg-transparent">
                        <div class="engine-label mb-2">
                            <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                            <span data-i18n="studio.engine">推理引擎</span>
                        </div>
                        <div class="engine-switch">
                            <button id="localBtn" class="engine-btn active" onclick="setEngine('local')">
                                <i data-lucide="cpu" class="w-3 h-3"></i><span data-i18n="studio.local">本地 ComfyUI</span>
                            </button>
                            <button id="cloudBtn" class="engine-btn" onclick="setEngine('cloud')">
                                <i data-lucide="cloud" class="w-3 h-3"></i>ModelScope 云端
                            </button>
                        </div>
                        <div id="cloudStatusBar" class="cloud-status mt-2">
                            <div class="cloud-dot"></div>
                            <span id="cloudStatusText" data-i18n="studio.connecting">Connecting...</span>
                        </div>
                        <div id="loraSection" class="hidden flex-col gap-3 pt-3 mt-3 border-t border-[var(--line)]">
                            <label class="flex items-center gap-3 cursor-pointer select-none" onclick="toggleLora()">
                                <div class="relative w-9 h-5 flex-shrink-0">
                                    <div id="loraTrack" class="lora-track w-full h-full rounded-full transition-colors duration-200"></div>
                                    <div id="loraThumb" class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200"></div>
                                </div>
                                <span class="text-xs font-semibold text-[var(--text)] uppercase tracking-wider" data-i18n="studio.detailLora">细节增强 LoRA</span>
                            </label>
                            <div id="loraStrengthRow" class="hidden flex-col gap-1.5">
                                <div class="flex justify-between">
                                    <span class="text-[10px] font-semibold text-[var(--ink-secondary)] uppercase tracking-widest" data-i18n="studio.loraStrength">LoRA 权重</span>
                                    <span id="loraStrengthVal" class="text-xs font-mono font-semibold text-[var(--text)]">0.80</span>
                                </div>
                                <input type="range" id="loraStrengthSlider" min="0.1" max="1.0" step="0.05" value="0.8"
                                    class="w-full h-1.5 rounded-lg appearance-none cursor-pointer"
                                    oninput="document.getElementById('loraStrengthVal').textContent=parseFloat(this.value).toFixed(2)">
                            </div>
                        </div>
                    </div>

                    <button id="genBtn" onclick="submitWorkflow()"
                        class="studio-btn-primary w-full h-12 text-white rounded-xl font-medium flex items-center justify-center gap-2 shadow-sm transition-all text-xs uppercase tracking-wider">
                        <i data-lucide="sparkles" id="btnIcon" class="w-4 h-4"></i>
                        <span id="btnText" data-i18n="studio.executeSynthesis">开始重绘生成</span>
                    </button>
                </section>
            </div>

            <!-- Right Canvas Stage -->
            <div class="studio-workbench-right">
                <div id="resultBox"
                    class="studio-stage-frame group">
                    <!-- Stage Header Bar -->
                    <div class="absolute top-0 inset-x-0 h-11 px-5 flex items-center justify-between border-b border-[var(--line)] bg-[var(--card)]/80 backdrop-blur-md z-10">
                        <div class="flex items-center gap-2 text-xs font-semibold text-[var(--ink-secondary)]">
                            <i data-lucide="scan" class="w-3.5 h-3.5"></i>
                            <span class="uppercase tracking-wider">CANVAS STAGE</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="zoomImage()" class="p-1.5 rounded-lg hover:bg-[var(--soft)] text-[var(--ink-secondary)] transition-colors" title="全屏查看">
                                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <div id="placeholder" class="text-center space-y-3 opacity-30 py-20">
                        <div class="w-14 h-14 rounded-2xl border border-dashed border-[var(--line-2,#94a3b8)] flex items-center justify-center mx-auto">
                            <i data-lucide="image" class="w-6 h-6 stroke-[1.5]"></i>
                        </div>
                        <div class="space-y-1">
                            <p class="text-xs font-bold uppercase tracking-[0.2em]" data-i18n="studio.canvasReady">CANVAS READY</p>
                            <p class="text-[11px] text-[var(--ink-tertiary)]">输入提示词并配置参考层，合成画作将在此呈现</p>
                        </div>
                    </div>

                    <div id="loader" class="hidden text-center space-y-4 py-20">
                        <div class="w-8 h-8 border-2 border-[var(--strong)] border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="text-xs font-medium uppercase tracking-[0.2em] text-[var(--ink-secondary)] animate-pulse" data-i18n="studio.synthesizing">Synthesizing...</p>
                    </div>

                    <img id="outputImg"
                        class="hidden w-full h-full object-contain p-6 pt-14 cursor-zoom-in transition-all duration-500"
                        onclick="zoomImage()">

                    <a id="downloadBtn" href="#" download
                        class="hidden absolute bottom-6 right-6 w-11 h-11 bg-[var(--card)] shadow-lg rounded-xl flex items-center justify-center hover:bg-[var(--strong)] hover:text-[var(--strong-text)] transition-all border border-[var(--line)] z-20">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </a>
                </div>
            </div>
        </main>

        <section class="mt-16">
            <div class="flex items-center gap-6 mb-8">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-[var(--ink-secondary)]" data-i18n="studio.archives">Archives</h2>
                <div class="h-px flex-1 bg-[var(--line)]"></div>
            </div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger"
                class="py-20 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black transition-colors">
                <span data-i18n="studio.loadMore">Load More Archive</span>
            </div>
        </section>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-white/95 backdrop-blur-3xl">
        <div class="max-w-6xl w-full flex flex-col items-center relative">
            <div class="relative w-full flex justify-center mb-8">
                <div id="compareContainer"
                    class="hidden relative w-full h-[75vh] rounded-[2.5rem] overflow-hidden shadow-2xl bg-[#fafafa]">
                    <img id="compareGenerated" class="absolute inset-0 w-full h-full object-contain">
                    <div id="compareOriginalWrapper"
                        class="absolute inset-0 w-full h-full overflow-hidden border-r-2 border-white/50">
                        <img id="compareOriginal" class="absolute inset-0 w-full h-full object-contain">
                    </div>
                    <div id="compareSlider" class="absolute inset-y-0 left-1/2 w-0.5 bg-white z-20 cursor-ew-resize">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-white shadow-2xl rounded-full flex items-center justify-center border border-gray-100">
                            <i data-lucide="move-horizontal" class="w-4 h-4 text-black"></i>
                        </div>
                    </div>
                </div>
                <div id="lightboxFrame" class="studio-preview-frame hidden">
                    <img id="lightboxImg" src="" class="studio-preview-img" alt="preview">
                    <div id="lightboxRes" data-no-pan
                        class="absolute top-6 left-6 bg-black/30 backdrop-blur-md border border-white/20 text-white px-3 py-1.5 rounded-full text-[10px] font-medium tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none z-30">
                    </div>
                    <button onclick="downloadLightboxImage()" data-no-pan
                        class="absolute top-6 right-6 bg-black text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-2xl z-30 hover:scale-105 transition-transform pointer-events-auto">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="w-full bg-white border border-gray-100 rounded-[2rem] p-8 shadow-sm flex justify-between items-center gap-8">
                <div class="flex-1">
                    <span class="text-[9px] font-bold text-gray-300 uppercase tracking-widest block mb-2" data-i18n="studio.promptExecution">Prompt Execution</span>
                    <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed"></p>
                </div>
                <button id="sameStyleBtn" onclick="applySameStyle()"
                    class="hidden whitespace-nowrap bg-black text-white px-8 py-3.5 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-gray-800 transition-all active:scale-95 flex items-center gap-2">
                    <i data-lucide="copy" class="w-4 h-4"></i><span data-i18n="studio.replicate">Replicate</span>
                </button>
            </div>
            <button onclick="closeLightbox()"
                class="absolute -top-12 -right-12 p-4 text-gray-400 hover:text-black transition-colors">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('nav.imageEdit');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('studio.loadMore');
        }
        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => { document.title = tr('nav.imageEdit'); });

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID_KEY = "client_id";
        let CLIENT_ID = localStorage.getItem(CLIENT_ID_KEY) || generateUUID();
        localStorage.setItem(CLIENT_ID_KEY, CLIENT_ID);

        let uploadedNames = { 1: "", 2: "", 3: "" };
        let base64Images = { 1: "", 2: "", 3: "" };
        let allHistory = [];
        let currentResult = null;
        let currentLightboxData = null;
        let currentIndex = 0;
        const PAGE_SIZE = 24;
        let isLoading = false;
        let engine = 'local';
        let loraEnabled = false;

        // 引擎切换
        function setEngine(mode) {
            engine = mode;
            document.getElementById('localBtn').classList.toggle('active', mode === 'local');
            document.getElementById('cloudBtn').classList.toggle('active', mode === 'cloud');
            document.getElementById('cloudImgNote').classList.toggle('hidden', mode === 'local');
            const loraSection = document.getElementById('loraSection');
            if (mode === 'cloud') {
                loraSection.classList.remove('hidden');
                loraSection.classList.add('flex');
            } else {
                loraSection.classList.add('hidden');
                loraSection.classList.remove('flex');
            }
        }

        function toggleLora() {
            loraEnabled = !loraEnabled;
            document.getElementById('loraTrack').classList.toggle('on', loraEnabled);
            document.getElementById('loraThumb').style.transform = loraEnabled ? 'translateX(16px)' : '';
            const row = document.getElementById('loraStrengthRow');
            row.classList.toggle('hidden', !loraEnabled);
            row.classList.toggle('flex', loraEnabled);
        }

        function setCloudStatus(text, visible = true) {
            const bar = document.getElementById('cloudStatusBar');
            const label = document.getElementById('cloudStatusText');
            label.textContent = text;
            bar.classList.toggle('visible', visible);
        }

        // 拖拽上传
        let hoveredSlot = null;
        [1, 2, 3].forEach(id => {
            const zone = document.getElementById(`drop-zone-${id}`);
            if (!zone) return;
            zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
            zone.ondragleave = () => { zone.classList.remove('drag-over'); };
            zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0], id); };
            zone.addEventListener('mouseenter', () => hoveredSlot = id);
            zone.addEventListener('mouseleave', () => { if (hoveredSlot === id) hoveredSlot = null; });
        });

        window.addEventListener('paste', (e) => {
            if (!hoveredSlot) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    handleFile(item.getAsFile(), hoveredSlot);
                    break;
                }
            }
        });

        async function handleFile(file, index) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Images[index] = e.target.result;
                const prev = document.getElementById(`prev${index}`);
                prev.src = e.target.result;
                prev.classList.remove('hidden');
                document.getElementById(`del${index}`).classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            // Also upload to ComfyUI for local mode
            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                uploadedNames[index] = data.files[0].comfy_name;
            } catch (e) { uploadedNames[index] = file.name; }
        }

        function clearSlot(index, ev) {
            if (ev) ev.stopPropagation();
            const prev = document.getElementById(`prev${index}`);
            prev.src = ""; prev.classList.add("hidden");
            document.getElementById(`del${index}`).classList.add("hidden");
            uploadedNames[index] = "";
            base64Images[index] = "";
        }

        async function submitWorkflow() {
            if (engine === 'cloud') {
                await submitCloud();
            } else {
                await submitLocal();
            }
        }

        async function submitLocal() {
            if (!uploadedNames[1]) { alert("Please upload Main Image (Slot 1)"); return; }
            const btn = document.getElementById('genBtn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span class="text-xs uppercase tracking-wider">${tr('studio.synthesizing') || 'Synthesizing...'}</span>`;
            lucide.createIcons();
            placeholder.classList.add('hidden');
            loader.classList.remove('hidden');

            const payload = {
                prompt: document.getElementById('promptInput').value,
                workflow_json: "Flux2-Klein.json",
                type: "klein",
                params: {
                    "168": { "text": document.getElementById('promptInput').value },
                    "158": { "noise_seed": Math.floor(Math.random() * 1000000) },
                    "278": { "image": uploadedNames[1] },
                    "270": { "image": uploadedNames[2] || "" },
                    "292": { "image": uploadedNames[3] || "" },
                    "313": { "value": uploadedNames[2] !== "" },
                    "314": { "value": uploadedNames[3] !== "" }
                }
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...payload, client_id: CLIENT_ID })
                });
                const result = await response.json();
                if (result.images?.[0]) {
                    currentResult = result;
                    outputImg.src = result.images[0];
                    outputImg.classList.remove('hidden');
                    downloadBtn.classList.remove('hidden');
                    downloadBtn.href = result.images[0];
                    renderImageCard(result, true);
                } else if (result.error) {
                    alert("Generation failed: " + result.error);
                    placeholder.classList.remove('hidden');
                }
            } catch (err) {
                alert("Generation failed: " + err.message);
                placeholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs uppercase tracking-wider">${tr('studio.executeSynthesis')}</span>`;
                lucide.createIcons();
            }
        }

        // 将主图尺寸对齐到 64 的倍数，使云端出图尺寸与原图一致
        function computeMsSize(w, h) {
            w = Math.round(w) || 0;
            h = Math.round(h) || 0;
            if (!w || !h) return { width: 1024, height: 1024 };
            const MIN = 512, MAX = 2048;
            const longest = Math.max(w, h);
            if (longest > MAX) {
                const scale = MAX / longest;
                w = Math.round(w * scale);
                h = Math.round(h * scale);
            }
            const align = (v) => Math.min(MAX, Math.max(MIN, Math.round(v / 64) * 64));
            return { width: align(w), height: align(h) };
        }

        async function submitCloud() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) { alert("Please enter a prompt"); return; }
            if (!base64Images[1]) { alert("Please upload Main Image (Slot 1) for cloud generation"); return; }

            const btn = document.getElementById('genBtn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span class="text-xs uppercase tracking-wider">${tr('studio.cloudProcessing')}</span>`;
            lucide.createIcons();
            placeholder.classList.add('hidden');
            loader.classList.remove('hidden');
            setCloudStatus(tr('studio.submittingModelscope'));

            // Collect image URLs (base64 data URIs)
            const imageUrls = [base64Images[1], base64Images[2], base64Images[3]].filter(Boolean);

            try {
                setCloudStatus('Processing with FLUX.2-Klein...');
                const mainPrev = document.getElementById('prev1');
                const msSize = computeMsSize(mainPrev && mainPrev.naturalWidth, mainPrev && mainPrev.naturalHeight);
                const msPayload = {
                    prompt,
                    model: 'black-forest-labs/FLUX.2-klein-9B',
                    image_urls: imageUrls,
                    width: msSize.width,
                    height: msSize.height,
                    client_id: CLIENT_ID
                };
                if (loraEnabled) {
                    const strength = parseFloat(document.getElementById('loraStrengthSlider').value);
                    msPayload.loras = { 'Daniel8152/Klein-enhance': strength };
                }
                const response = await fetch('/api/ms/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(msPayload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Cloud generation failed');
                }

                const result = await response.json();
                if (result.url) {
                    const resultData = {
                        prompt,
                        images: [result.url],
                        timestamp: Date.now() / 1000,
                        type: 'klein',
                        model: 'black-forest-labs/FLUX.2-klein-9B'
                    };
                    currentResult = resultData;
                    outputImg.src = result.url;
                    outputImg.classList.remove('hidden');
                    downloadBtn.classList.remove('hidden');
                    downloadBtn.href = result.url;
                    renderImageCard(resultData, true);
                    setCloudStatus('Done!', false);
                }
            } catch (err) {
                setCloudStatus(err.message, false);
                alert("Cloud generation failed: " + err.message);
                placeholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs uppercase tracking-wider">${tr('studio.executeSynthesis')}</span>`;
                lucide.createIcons();
            }
        }

        // --- Compare Slider ---
        function initCompareSlider() {
            const container = document.getElementById('compareContainer');
            const wrapper = document.getElementById('compareOriginalWrapper');
            const slider = document.getElementById('compareSlider');
            let isDragging = false;
            const updateSlider = (clientX) => {
                const rect = container.getBoundingClientRect();
                let percent = Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
                wrapper.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
                slider.style.left = `${percent}%`;
            };
            const start = (e) => { isDragging = true; e.preventDefault(); };
            const end = () => isDragging = false;
            const move = (e) => {
                if (!isDragging) return;
                updateSlider(e.touches ? e.touches[0].clientX : e.clientX);
            };
            container.addEventListener('mousedown', (e) => { if (e.target === slider) return; updateSlider(e.clientX); start(e); });
            slider.addEventListener('mousedown', start);
            window.addEventListener('mouseup', end);
            window.addEventListener('mousemove', move);
            slider.addEventListener('touchstart', start, { passive: false });
            window.addEventListener('touchend', end);
            window.addEventListener('touchmove', move, { passive: false });
        }
        initCompareSlider();

        let lightboxPreview = null;
        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }

        function openLightbox(dataOrUrl) {
            const lb = document.getElementById('lightbox');
            const frame = document.getElementById('lightboxFrame');
            const img = document.getElementById('lightboxImg');
            const comp = document.getElementById('compareContainer');
            const promptEl = document.getElementById('lightboxPrompt');
            const sameStyleBtn = document.getElementById('sameStyleBtn');
            const resPill = document.getElementById('lightboxRes');

            let data = (typeof dataOrUrl === 'string') ? { images: [dataOrUrl] } : dataOrUrl;
            currentLightboxData = data;
            promptEl.textContent = data.prompt || "No prompt metadata found";
            resPill.style.opacity = '0';

            const updateRes = (target) => {
                if (target.naturalWidth) {
                    resPill.innerText = `${target.naturalWidth} x ${target.naturalHeight}`;
                    resPill.style.opacity = '1';
                }
            };

            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();

            if (data.params?.["278"]?.image) {
                frame.classList.add('hidden');
                comp.classList.remove('hidden');
                const genImg = document.getElementById('compareGenerated');
                genImg.src = data.images[0];
                document.getElementById('compareOriginal').src = `/api/view?filename=${encodeURIComponent(data.params["278"].image)}&type=input`;
                document.getElementById('compareOriginalWrapper').style.clipPath = 'inset(0 50% 0 0)';
                document.getElementById('compareSlider').style.left = '50%';
                genImg.onload = () => updateRes(genImg);
                if (genImg.complete) updateRes(genImg);
            } else {
                comp.classList.add('hidden');
                frame.classList.remove('hidden');
                img.src = data.images[0];
                img.onload = () => updateRes(img);
                if (img.complete) updateRes(img);
            }

            sameStyleBtn.classList.toggle('hidden', !data.params);
            lb.classList.replace('hidden', 'flex');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.replace('flex', 'hidden');
            document.body.style.overflow = 'auto';
        }

        function handleOutsideClick(e) { if (e.target.id === 'lightbox') closeLightbox(); }

        function renderImageCard(data, isNew = false) {
            const masonry = document.getElementById('masonry');
            if (document.getElementById(`history-${data.timestamp}`)) return;
            const imgSrc = (typeof safeMediaUrl === 'function') ? safeMediaUrl(data.images?.[0]) : (data.images?.[0] || '');
            if (!imgSrc) return;
            const safePrompt = (typeof escapeHtml === 'function') ? escapeHtml(data.prompt || "Klein Archive") : (data.prompt || "Klein Archive");
            const safeModel = data.model ? ((typeof escapeHtml === 'function') ? escapeHtml(data.model.split('/').pop()) : data.model.split('/').pop()) : '';
            const card = document.createElement('div');
            card.id = `history-${data.timestamp}`;
            card.dataset.historyTs = data.timestamp;
            card.className = 'masonry-item group relative cursor-zoom-in';
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(data); };
            card.innerHTML = `
                <img src="${imgSrc}" class="w-full h-full object-cover block transform group-hover:scale-105 transition-transform duration-1000" loading="lazy">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all p-6 flex flex-col justify-end">
                    <p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">${safePrompt}</p>
                    ${safeModel ? `<p class="text-white/50 text-[9px] mt-1">${safeModel}</p>` : ''}
                </div>
            `;
            isNew ? masonry.prepend(card) : masonry.appendChild(card);
            lucide.createIcons();
        }

        async function applySameStyle() {
            if (!currentLightboxData?.params) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || "";
            const params = currentLightboxData.params;
            const setSlot = (slotId, nodeId) => {
                if (params[nodeId]?.image) {
                    const fname = params[nodeId].image;
                    uploadedNames[slotId] = fname;
                    const prev = document.getElementById(`prev${slotId}`);
                    prev.src = `/api/view?filename=${encodeURIComponent(fname)}&type=input`;
                    prev.classList.remove('hidden');
                    document.getElementById(`del${slotId}`).classList.remove('hidden');
                } else { clearSlot(slotId); }
            };
            setSlot(1, "278"); setSlot(2, "270"); setSlot(3, "292");
            closeLightbox();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadHistory(page = 0) {
            if (isLoading) return;
            const loader = document.getElementById('loadMoreTrigger');
            try {
                isLoading = true;
                if (page === 0) {
                    loader.innerText = tr('studio.loadingArchives');
                    const res = await fetch('/api/history?type=klein');
                    allHistory = await res.json();
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;
                } else {
                    loader.innerText = "Loading...";
                    await new Promise(r => setTimeout(r, 400));
                }
                const nextData = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
                nextData.forEach(item => renderImageCard(item));
                currentIndex += nextData.length;
                if (currentIndex >= allHistory.length) {
                    loader.classList.add('hidden');
                } else {
                    loader.classList.remove('hidden');
                    loader.innerText = "Load More Archive";
                }
            } catch (e) {
                console.error(e);
                loader.textContent = "Error loading history";
            } finally {
                isLoading = false;
            }
        }

        function zoomImage() { if (currentResult) openLightbox(currentResult); }

        function downloadLightboxImage() {
            const url = currentLightboxData?.images[0];
            if (!url) return;
            const link = document.createElement('a');
            link.href = url;
            link.download = `Klein-${Date.now()}.png`;
            link.click();
        }

        async function deleteHistoryItem(ts, ev) {
            ev.stopPropagation();
            if (!confirm("Delete this archive?")) return;
            try {
                const res = await fetch('/api/history/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: ts })
                });
                if ((await res.json()).success) {
                    document.getElementById(`history-${ts}`).remove();
                }
            } catch (e) { alert("Delete failed"); }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && currentIndex < allHistory.length) loadHistory(1);
        }, { threshold: 0.1 });

        window.onload = () => {
            applyLanguage();
            loadHistory(0).then(() => {
                window.HistoryBulkManager?.attach({masonry:'#masonry'});
                const trigger = document.getElementById('loadMoreTrigger');
                if (trigger) { observer.observe(trigger); trigger.onclick = () => loadHistory(1); }
            });
        };
    </script>
</body>
